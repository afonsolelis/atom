<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" font-family="'Segoe UI',Arial,sans-serif" role="img" aria-label="Sequência do licenciamento ambiental: licença prévia, de instalação e de operação">
  <defs>
    <marker id="lc" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#002057"/></marker>
    <marker id="lt" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="210" fill="#ffffff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#002057">Licenciamento ambiental (IBAMA / órgãos estaduais)</text>

  <!-- LP -->
  <rect x="20" y="56" width="180" height="78" rx="10" fill="#ffffff" stroke="#1F8A4E" stroke-width="1.8"/>
  <rect x="20" y="56" width="180" height="24" rx="10" fill="#1F8A4E"/>
  <rect x="20" y="70" width="180" height="10" fill="#1F8A4E"/>
  <text x="110" y="73" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">LP — Licença Prévia</text>
  <text x="110" y="100" text-anchor="middle" font-size="11" fill="#002057">viabilidade e localização</text>
  <text x="110" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#002057">exige EIA/RIMA</text>

  <!-- LI -->
  <rect x="230" y="56" width="180" height="78" rx="10" fill="#ffffff" stroke="#D4912B" stroke-width="1.8"/>
  <rect x="230" y="56" width="180" height="24" rx="10" fill="#D4912B"/>
  <rect x="230" y="70" width="180" height="10" fill="#D4912B"/>
  <text x="320" y="73" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">LI — Lic. de Instalação</text>
  <text x="320" y="104" text-anchor="middle" font-size="11" fill="#002057">autoriza o início</text>
  <text x="320" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#002057">da construção</text>

  <!-- LO -->
  <rect x="440" y="56" width="180" height="78" rx="10" fill="#ffffff" stroke="#1F44A8" stroke-width="1.8"/>
  <rect x="440" y="56" width="180" height="24" rx="10" fill="#1F44A8"/>
  <rect x="440" y="70" width="180" height="10" fill="#1F44A8"/>
  <text x="530" y="73" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">LO — Lic. de Operação</text>
  <text x="530" y="104" text-anchor="middle" font-size="11" fill="#002057">autoriza o</text>
  <text x="530" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#002057">funcionamento</text>

  <!-- setas -->
  <line x1="201" y1="95" x2="228" y2="95" stroke="#002057" stroke-width="2" marker-end="url(#lc)"/>
  <line x1="411" y1="95" x2="438" y2="95" stroke="#002057" stroke-width="2" marker-end="url(#lc)"/>

  <!-- linha do tempo -->
  <line x1="20" y1="170" x2="600" y2="170" stroke="#c0392b" stroke-width="2" marker-end="url(#lt)"/>
  <text x="310" y="192" text-anchor="middle" font-size="11.5" fill="#c0392b" font-weight="700">tempo (frequentemente anos) — costuma ser o maior gargalo de prazo da obra</text>
</svg>
