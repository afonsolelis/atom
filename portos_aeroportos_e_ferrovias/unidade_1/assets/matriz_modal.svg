<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Segoe UI',Arial,sans-serif" role="img" aria-label="Gráfico de barras da matriz de transporte de cargas do Brasil por modal">
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#002057">Matriz de transporte de cargas — Brasil (participação aproximada)</text>

  <!-- gridlines -->
  <g stroke="#d8dde3" stroke-width="1">
    <line x1="70" y1="231" x2="600" y2="231"/>
    <line x1="70" y1="163" x2="600" y2="163"/>
    <line x1="70" y1="95" x2="600" y2="95"/>
  </g>
  <g font-size="10" fill="#7a828c" text-anchor="end">
    <text x="62" y="304">0%</text>
    <text x="62" y="235">20%</text>
    <text x="62" y="167">40%</text>
    <text x="62" y="99">60%</text>
  </g>

  <!-- eixos -->
  <line x1="70" y1="60" x2="70" y2="300" stroke="#002057" stroke-width="1.4"/>
  <line x1="70" y1="300" x2="608" y2="300" stroke="#002057" stroke-width="1.4"/>

  <!-- barras -->
  <g>
    <rect x="85" y="91" width="70" height="209" fill="#c0392b"/>
    <text x="120" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">~61%</text>
    <rect x="190" y="228" width="70" height="72" fill="#1F44A8"/>
    <text x="225" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#1F44A8">~21%</text>
    <rect x="295" y="252" width="70" height="48" fill="#2a6f97"/>
    <text x="330" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#2a6f97">~14%</text>
    <rect x="400" y="286" width="70" height="14" fill="#6b7280"/>
    <text x="435" y="279" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280">~4%</text>
    <rect x="505" y="296" width="70" height="4" fill="#b0b6bd"/>
    <text x="540" y="289" text-anchor="middle" font-size="13" font-weight="700" fill="#8a8f96">&lt;1%</text>
  </g>

  <!-- nomes -->
  <g font-size="11.5" fill="#002057" text-anchor="middle">
    <text x="120" y="318">Rodoviário</text>
    <text x="225" y="318">Ferroviário</text>
    <text x="330" y="318">Aquaviário</text>
    <text x="435" y="318">Dutoviário</text>
    <text x="540" y="318">Aéreo</text>
  </g>

  <text x="320" y="345" text-anchor="middle" font-size="11.5" fill="#c0392b" font-weight="700">Herança rodoviarista: um país continental deveria usar mais ferrovia e hidrovia para grandes volumes.</text>
</svg>
