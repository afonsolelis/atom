<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="'Segoe UI',Arial,sans-serif" role="img" aria-label="Seção transversal de um aterro trapezoidal com plataforma, taludes 1 para 1,5 e altura, cotado">
  <defs>
    <marker id="ga" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#002057"/></marker>
    <marker id="gs" markerWidth="9" markerHeight="9" refX="2" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M7,0 L0,3 L7,6 Z" fill="#002057"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="280" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#002057">Seção de aterro (terraplenagem) — cotada</text>

  <!-- terreno natural -->
  <line x1="20" y1="190" x2="620" y2="190" stroke="#6b5d3f" stroke-width="2"/>
  <text x="560" y="205" font-size="10.5" fill="#6b5d3f">terreno natural</text>

  <!-- aterro trapezoidal -->
  <polygon points="185,100 455,100 590,190 50,190" fill="#cdbf9e" stroke="#9a8c6a" stroke-width="1.6"/>
  <g stroke="#b3a684" stroke-width="1" opacity="0.7">
    <line x1="120" y1="160" x2="520" y2="160" stroke-dasharray="6 5"/>
    <line x1="155" y1="130" x2="485" y2="130" stroke-dasharray="6 5"/>
  </g>
  <text x="320" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5a4d33">aterro compactado</text>

  <!-- cota plataforma b (topo) -->
  <line x1="185" y1="86" x2="455" y2="86" stroke="#002057" stroke-width="1.3" marker-start="url(#gs)" marker-end="url(#ga)"/>
  <line x1="185" y1="100" x2="185" y2="82" stroke="#002057" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="455" y1="100" x2="455" y2="82" stroke="#002057" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="320" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#002057">plataforma b = 12 m</text>

  <!-- cota base B -->
  <line x1="50" y1="210" x2="590" y2="210" stroke="#002057" stroke-width="1.3" marker-start="url(#gs)" marker-end="url(#ga)"/>
  <line x1="50" y1="190" x2="50" y2="214" stroke="#002057" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="590" y1="190" x2="590" y2="214" stroke="#002057" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="320" y="228" text-anchor="middle" font-size="12.5" font-weight="700" fill="#002057">B = b + 2·(1,5·h) = 24 m</text>

  <!-- cota altura h -->
  <line x1="610" y1="100" x2="610" y2="190" stroke="#002057" stroke-width="1.3" marker-start="url(#gs)" marker-end="url(#ga)"/>
  <line x1="455" y1="100" x2="614" y2="100" stroke="#002057" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="600" y="145" font-size="12.5" font-weight="700" fill="#002057" transform="rotate(-90 600 145)" text-anchor="middle">h = 4 m</text>

  <!-- talude -->
  <text x="92" y="150" font-size="11.5" font-weight="700" fill="#1F8A4E">1 : 1,5</text>
  <text x="92" y="166" font-size="9" fill="#1F8A4E">(V : H)</text>

  <text x="320" y="258" text-anchor="middle" font-size="11.5" fill="#002057">A = (b + B)/2 × h = (12 + 24)/2 × 4 = <tspan font-weight="700">72 m²</tspan>   ·   L = 200 m → V = <tspan font-weight="700">14.400 m³</tspan></text>
</svg>
