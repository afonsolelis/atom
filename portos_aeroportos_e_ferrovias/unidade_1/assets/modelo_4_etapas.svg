<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" font-family="'Segoe UI',Arial,sans-serif" role="img" aria-label="Fluxo do modelo de quatro etapas: geração, distribuição, divisão modal e alocação de tráfego">
  <defs>
    <marker id="m4" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#002057"/></marker>
  </defs>
  <rect x="0" y="0" width="680" height="250" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#002057">Modelo de quatro etapas (previsão de demanda)</text>

  <text x="20" y="62" font-size="11" fill="#1F8A4E" font-weight="700">entrada: dados socioeconômicos (população, empregos, economia)</text>

  <g>
    <!-- box 1 -->
    <rect x="20" y="80" width="140" height="96" rx="10" fill="#ffffff" stroke="#002057" stroke-width="1.6"/>
    <rect x="20" y="80" width="140" height="26" rx="10" fill="#002057"/>
    <rect x="20" y="96" width="140" height="10" fill="#002057"/>
    <text x="90" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#F0CE29">1 · Geração</text>
    <text x="90" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="#002057">Quantas viagens</text>
    <text x="90" y="146" text-anchor="middle" font-size="11.5" font-weight="700" fill="#002057">nascem?</text>
    <text x="90" y="165" text-anchor="middle" font-size="9.5" fill="#5a6573">produção × atração</text>
    <!-- box 2 -->
    <rect x="182" y="80" width="140" height="96" rx="10" fill="#ffffff" stroke="#002057" stroke-width="1.6"/>
    <rect x="182" y="80" width="140" height="26" rx="10" fill="#002057"/>
    <rect x="182" y="96" width="140" height="10" fill="#002057"/>
    <text x="252" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#F0CE29">2 · Distribuição</text>
    <text x="252" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="#002057">Para onde vão?</text>
    <text x="252" y="151" text-anchor="middle" font-size="9.5" fill="#5a6573">modelo gravitacional</text>
    <!-- box 3 -->
    <rect x="344" y="80" width="140" height="96" rx="10" fill="#ffffff" stroke="#002057" stroke-width="1.6"/>
    <rect x="344" y="80" width="140" height="26" rx="10" fill="#002057"/>
    <rect x="344" y="96" width="140" height="10" fill="#002057"/>
    <text x="414" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#F0CE29">3 · Divisão modal</text>
    <text x="414" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="#002057">Qual modal?</text>
    <text x="414" y="151" text-anchor="middle" font-size="9.5" fill="#5a6573">carro / ônibus / trem</text>
    <!-- box 4 -->
    <rect x="506" y="80" width="140" height="96" rx="10" fill="#ffffff" stroke="#002057" stroke-width="1.6"/>
    <rect x="506" y="80" width="140" height="26" rx="10" fill="#002057"/>
    <rect x="506" y="96" width="140" height="10" fill="#002057"/>
    <text x="576" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#F0CE29">4 · Alocação</text>
    <text x="576" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="#002057">Por qual rota</text>
    <text x="576" y="146" text-anchor="middle" font-size="11.5" font-weight="700" fill="#002057">na rede?</text>
  </g>

  <!-- setas -->
  <g>
    <line x1="161" y1="128" x2="180" y2="128" stroke="#002057" stroke-width="2" marker-end="url(#m4)"/>
    <line x1="323" y1="128" x2="342" y2="128" stroke="#002057" stroke-width="2" marker-end="url(#m4)"/>
    <line x1="485" y1="128" x2="504" y2="128" stroke="#002057" stroke-width="2" marker-end="url(#m4)"/>
  </g>

  <text x="660" y="206" text-anchor="end" font-size="11" fill="#1F8A4E" font-weight="700">saída: fluxos previstos → dimensionamento da capacidade</text>
</svg>
