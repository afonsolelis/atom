<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 380" font-family="'Segoe UI',Arial,sans-serif" role="img" aria-label="Perfil Vignole de trilho ferroviário com boleto, alma e patim cotados">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#002057"/>
    </marker>
    <marker id="arrS" markerWidth="9" markerHeight="9" refX="2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M7,0 L0,3 L7,6 Z" fill="#002057"/>
    </marker>
    <linearGradient id="aco" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa6b4"/>
      <stop offset="0.5" stop-color="#d6dce3"/>
      <stop offset="1" stop-color="#9aa6b4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="470" height="380" fill="#ffffff"/>
  <text x="235" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#002057">Perfil Vignole — trilho ferroviário (cotas do TR-68)</text>

  <!-- corpo do trilho -->
  <polygon points="172.5,60 247.5,60 247.5,95 245,103 232,112 219,125 219,250 230,262 265,280 286,288 286,300 134,300 134,288 155,280 190,262 201,250 201,125 188,112 175,103 172.5,95"
           fill="url(#aco)" stroke="#002057" stroke-width="2" stroke-linejoin="round"/>

  <!-- cota da altura H (direita) -->
  <line x1="330" y1="60" x2="330" y2="300" stroke="#002057" stroke-width="1.3" marker-start="url(#arrS)" marker-end="url(#arr)"/>
  <line x1="286" y1="60" x2="334" y2="60" stroke="#002057" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="286" y1="300" x2="334" y2="300" stroke="#002057" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="350" y="184" font-size="13.5" font-weight="700" fill="#002057" transform="rotate(-90 350 184)" text-anchor="middle">H = 185,7 mm</text>

  <!-- cota da largura do boleto (topo) -->
  <line x1="172.5" y1="44" x2="247.5" y2="44" stroke="#002057" stroke-width="1.3" marker-start="url(#arrS)" marker-end="url(#arr)"/>
  <text x="210" y="38" font-size="12.5" font-weight="700" fill="#002057" text-anchor="middle">boleto 74,6 mm</text>

  <!-- cota da largura do patim B (base) -->
  <line x1="134" y1="326" x2="286" y2="326" stroke="#002057" stroke-width="1.3" marker-start="url(#arrS)" marker-end="url(#arr)"/>
  <line x1="134" y1="300" x2="134" y2="330" stroke="#002057" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="286" y1="300" x2="286" y2="330" stroke="#002057" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="210" y="346" font-size="13.5" font-weight="700" fill="#002057" text-anchor="middle">B (patim) = 152,4 mm</text>

  <!-- rótulos dos componentes -->
  <g font-size="14" font-weight="700" fill="#1F8A4E">
    <text x="40" y="84">Boleto</text>
    <text x="48" y="190">Alma</text>
    <text x="44" y="290">Patim</text>
  </g>
  <g stroke="#1F8A4E" stroke-width="1.3">
    <line x1="92" y1="80" x2="171" y2="82"/>
    <line x1="92" y1="186" x2="200" y2="186"/>
    <line x1="92" y1="286" x2="150" y2="290"/>
  </g>
  <g fill="#1F8A4E">
    <circle cx="171" cy="82" r="2.4"/>
    <circle cx="200" cy="186" r="2.4"/>
    <circle cx="150" cy="290" r="2.4"/>
  </g>
</svg>
