<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" font-family="'Segoe UI',Arial,sans-serif" role="img" aria-label="Contato roda-trilho mostrando a banda de rodagem cônica e o friso da roda sobre o boleto do trilho">
  <defs>
    <linearGradient id="aco3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aeb7c2"/><stop offset="1" stop-color="#cfd6dd"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="580" height="320" fill="#ffffff"/>
  <text x="290" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#002057">Contato roda-trilho: banda de rodagem cônica e friso</text>

  <!-- roda (corte transversal) -->
  <polygon points="255,118 372,118 372,224 300,232 276,232 274,250 266,254 258,250 256,232" fill="url(#aco3)" stroke="#002057" stroke-width="1.9" stroke-linejoin="round"/>
  <text x="313" y="175" text-anchor="middle" font-size="12" fill="#3a4250">roda</text>

  <!-- trilho (boleto + alma + patim) -->
  <rect x="278" y="232" width="70" height="22" rx="4" fill="#9aa6b4" stroke="#002057" stroke-width="1.6"/>
  <rect x="303" y="254" width="20" height="34" fill="#9aa6b4" stroke="#002057" stroke-width="1.6"/>
  <rect x="286" y="288" width="54" height="13" rx="2" fill="#9aa6b4" stroke="#002057" stroke-width="1.6"/>

  <!-- linha de referência horizontal e cone -->
  <line x1="276" y1="232" x2="372" y2="232" stroke="#1F8A4E" stroke-width="0.9" stroke-dasharray="4 3"/>
  <line x1="300" y1="232" x2="372" y2="224" stroke="#c0392b" stroke-width="2"/>
  <text x="430" y="210" font-size="11.5" fill="#c0392b" font-weight="700">conicidade ~1:20</text>
  <text x="430" y="224" font-size="10.5" fill="#c0392b">(inclinação exagerada)</text>

  <!-- rótulos -->
  <g font-size="13" font-weight="700" fill="#002057">
    <text x="70" y="252">Friso</text>
  </g>
  <text x="70" y="268" font-size="10.5" fill="#3a4250">(flange — guia a roda)</text>
  <line x1="118" y1="252" x2="262" y2="252" stroke="#002057" stroke-width="1.2"/>
  <circle cx="262" cy="252" r="2.4" fill="#002057"/>

  <text x="430" y="150" font-size="13" font-weight="700" fill="#002057">Banda de rodagem</text>
  <text x="430" y="166" font-size="10.5" fill="#3a4250">(cônica — autocentragem)</text>
  <line x1="428" y1="160" x2="345" y2="228" stroke="#002057" stroke-width="1.2"/>
  <circle cx="345" cy="228" r="2.4" fill="#002057"/>

  <text x="392" y="276" font-size="12.5" font-weight="700" fill="#002057">Boleto do trilho</text>
  <line x1="390" y1="272" x2="346" y2="246" stroke="#002057" stroke-width="1.2"/>
  <circle cx="346" cy="246" r="2.4" fill="#002057"/>

  <!-- lado interno / externo -->
  <text x="200" y="300" font-size="11" fill="#1F8A4E" font-weight="700">← lado interno (bitola)</text>
  <text x="372" y="300" font-size="11" fill="#1F8A4E" font-weight="700">lado externo →</text>
</svg>
