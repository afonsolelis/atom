<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Segoe UI',Arial,sans-serif" role="img" aria-label="Comparação entre contêiner de 20 pés (1 TEU) e de 40 pés (2 TEU), com dimensões ISO">
  <defs>
    <marker id="ta" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#002057"/></marker>
    <marker id="ts" markerWidth="9" markerHeight="9" refX="2" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M7,0 L0,3 L7,6 Z" fill="#002057"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#002057">Contêiner e a unidade TEU (Twenty-foot Equivalent Unit)</text>

  <!-- 20 pés -->
  <rect x="60" y="100" width="150" height="92" rx="3" fill="#c0392b" stroke="#7a2418" stroke-width="2"/>
  <g stroke="#7a2418" stroke-width="1" opacity="0.5"><line x1="85" y1="104" x2="85" y2="188"/><line x1="110" y1="104" x2="110" y2="188"/><line x1="135" y1="104" x2="135" y2="188"/><line x1="160" y1="104" x2="160" y2="188"/><line x1="185" y1="104" x2="185" y2="188"/></g>
  <g fill="#5a1a12"><rect x="62" y="102" width="8" height="8"/><rect x="200" y="102" width="8" height="8"/><rect x="62" y="182" width="8" height="8"/><rect x="200" y="182" width="8" height="8"/></g>
  <text x="135" y="148" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">1 TEU</text>
  <line x1="60" y1="208" x2="210" y2="208" stroke="#002057" stroke-width="1.2" marker-start="url(#ts)" marker-end="url(#ta)"/>
  <text x="135" y="226" text-anchor="middle" font-size="12.5" font-weight="700" fill="#002057">20 pés ≈ 6,06 m</text>
  <text x="135" y="244" text-anchor="middle" font-size="10.5" fill="#3a4250">2,44 m larg. × 2,59 m alt.</text>

  <!-- 40 pés -->
  <rect x="290" y="100" width="300" height="92" rx="3" fill="#1F44A8" stroke="#102a66" stroke-width="2"/>
  <g stroke="#102a66" stroke-width="1" opacity="0.5"><line x1="315" y1="104" x2="315" y2="188"/><line x1="340" y1="104" x2="340" y2="188"/><line x1="365" y1="104" x2="365" y2="188"/><line x1="390" y1="104" x2="390" y2="188"/><line x1="415" y1="104" x2="415" y2="188"/><line x1="440" y1="104" x2="440" y2="188"/><line x1="465" y1="104" x2="465" y2="188"/><line x1="490" y1="104" x2="490" y2="188"/><line x1="515" y1="104" x2="515" y2="188"/><line x1="540" y1="104" x2="540" y2="188"/><line x1="565" y1="104" x2="565" y2="188"/></g>
  <g fill="#0c1f4d"><rect x="292" y="102" width="8" height="8"/><rect x="580" y="102" width="8" height="8"/><rect x="292" y="182" width="8" height="8"/><rect x="580" y="182" width="8" height="8"/></g>
  <text x="440" y="148" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">2 TEU</text>
  <line x1="290" y1="208" x2="590" y2="208" stroke="#002057" stroke-width="1.2" marker-start="url(#ts)" marker-end="url(#ta)"/>
  <text x="440" y="226" text-anchor="middle" font-size="12.5" font-weight="700" fill="#002057">40 pés ≈ 12,19 m</text>

  <text x="320" y="278" text-anchor="middle" font-size="11.5" fill="#002057">Como a maioria é de 40', usa-se <tspan font-weight="700">~1,6–1,7 TEU por contêiner físico</tspan> movimentado.</text>
</svg>
