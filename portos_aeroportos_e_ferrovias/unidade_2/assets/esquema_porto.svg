<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Segoe UI',Arial,sans-serif" role="img" aria-label="Vista em planta de um porto organizado, com canal de acesso, quebra-mar, bacia de evolução, cais, retroárea e acessos terrestres">
  <defs>
    <marker id="pe" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#2a6f97"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="420" fill="#ffffff"/>
  <text x="330" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#002057">Esquema de um porto organizado (vista em planta)</text>

  <!-- mar e terra -->
  <rect x="30" y="40" width="600" height="200" fill="#bcd9ea"/>
  <rect x="30" y="240" width="600" height="95" fill="#e7ddc7"/>
  <text x="70" y="70" font-size="12" font-weight="700" fill="#2a6f97">MAR ABERTO</text>
  <text x="70" y="330" font-size="12" font-weight="700" fill="#8a7a52">TERRA</text>

  <!-- quebra-mar / molhe -->
  <polyline points="110,240 110,110 420,110" fill="none" stroke="#8a8f96" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- canal de acesso -->
  <path d="M 625,80 Q 510,92 445,120 Q 380,150 322,176" fill="none" stroke="#2a6f97" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#pe)"/>
  <!-- navio entrando -->
  <rect x="455" y="112" width="26" height="12" rx="4" fill="#1F44A8" transform="rotate(-28 468 118)"/>

  <!-- bacia de evolução -->
  <circle cx="300" cy="188" r="46" fill="none" stroke="#2a6f97" stroke-width="1.8" stroke-dasharray="7 5"/>

  <!-- cais e berços -->
  <rect x="130" y="236" width="320" height="8" fill="#5f6b7a"/>
  <rect x="170" y="220" width="46" height="15" rx="4" fill="#1F44A8"/>
  <rect x="262" y="220" width="46" height="15" rx="4" fill="#1F44A8"/>
  <rect x="354" y="220" width="46" height="15" rx="4" fill="#1F44A8"/>

  <!-- retroárea -->
  <rect x="150" y="250" width="90" height="40" fill="#cdbf9e" stroke="#9a8c6a" stroke-width="1.3"/>
  <rect x="255" y="250" width="90" height="40" fill="#cdbf9e" stroke="#9a8c6a" stroke-width="1.3"/>
  <rect x="360" y="250" width="85" height="40" fill="#cdbf9e" stroke="#9a8c6a" stroke-width="1.3"/>

  <!-- acessos terrestres -->
  <line x1="300" y1="290" x2="300" y2="334" stroke="#555" stroke-width="5"/>
  <line x1="345" y1="290" x2="345" y2="334" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- números -->
  <g font-size="12" font-weight="700">
    <circle cx="560" cy="92" r="12" fill="#002057"/><text x="560" y="96" text-anchor="middle" fill="#fff">1</text>
    <circle cx="128" cy="135" r="12" fill="#002057"/><text x="128" y="139" text-anchor="middle" fill="#fff">2</text>
    <circle cx="300" cy="150" r="12" fill="#002057"/><text x="300" y="154" text-anchor="middle" fill="#fff">3</text>
    <circle cx="112" cy="228" r="12" fill="#002057"/><text x="112" y="232" text-anchor="middle" fill="#fff">4</text>
    <circle cx="430" cy="270" r="12" fill="#002057"/><text x="430" y="274" text-anchor="middle" fill="#fff">5</text>
    <circle cx="322" cy="312" r="12" fill="#002057"/><text x="322" y="316" text-anchor="middle" fill="#fff">6</text>
  </g>

  <!-- legenda -->
  <g font-size="12.5" fill="#002057">
    <text x="40" y="365"><tspan font-weight="700">1</tspan> Canal de acesso    <tspan font-weight="700">2</tspan> Quebra-mar / molhe    <tspan font-weight="700">3</tspan> Bacia de evolução</text>
    <text x="40" y="392"><tspan font-weight="700">4</tspan> Cais e berços (navios atracados)    <tspan font-weight="700">5</tspan> Retroárea (pátios/armazéns)    <tspan font-weight="700">6</tspan> Acessos rod./ferr.</text>
  </g>
</svg>
