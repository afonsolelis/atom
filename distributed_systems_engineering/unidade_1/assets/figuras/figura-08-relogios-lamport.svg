  <line x1="230.0" y1="120.0" x2="1090.0" y2="120.0" stroke="#C7CEDB" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="25.0" y="240.0" width="195.0" height="60.0" rx="12" ry="12" fill="#FFFFFF" fill-opacity="1.0" stroke="#254AB9" stroke-width="2.2"/>
