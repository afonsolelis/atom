  <text x="380.0" y="466.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5A6175" text-anchor="middle">local</text>
  <circle cx="460.0" cy="420.0" r="17.0" fill="#FFFFFF" stroke="#002156" stroke-width="2.6"/>
  <text x="460.0" y="427.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#002156" text-anchor="middle">3</text>
