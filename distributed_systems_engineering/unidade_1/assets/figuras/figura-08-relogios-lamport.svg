  <text x="400.0" y="205.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#254AB9" text-anchor="start">“reservar item”, carimbo 2</text>
  <line x1="674.0" y1="257.0" x2="750.8" y2="142.8" stroke="#00B1D2" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="756.0,135.0 753.2,151.3 742.0,143.8" fill="#00B1D2"/>
  <rect x="683.0" y="192.1" width="244.0" height="21.0" rx="5" ry="5" fill="#FFFFFF" fill-opacity="1.0" stroke="none" stroke-width="0"/>
  <text x="690.0" y="205.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#254AB9" text-anchor="start">“reserva confirmada”, carimbo 4</text>
  <rect x="700.0" y="348.0" width="420.0" height="92.0" rx="10" ry="10" fill="#F2F4F8" fill-opacity="1.0" stroke="#FF2B5F" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="910.0" y="376.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#C2185B" text-anchor="middle">Mesmo carimbo 5 nas duas raias,</text>
  <text x="910.0" y="400.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#C2185B" text-anchor="middle">sem mensagem entre elas: coincidência</text>
  <text x="910.0" y="424.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#C2185B" text-anchor="middle">de contagem, não causalidade.</text>
  <rect x="230.0" y="500.0" width="470.0" height="56.0" rx="10" ry="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#002156" stroke-width="2"/>
  <text x="252.0" y="534.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#002156" text-anchor="start">Recebimento:</text>
  <text x="382.0" y="534.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="start"><tspan font-size="16.0" dy="-0.0">C ← max(C</tspan><tspan font-size="11.2" dy="3.8">local</tspan><tspan font-size="16.0" dy="-3.8">, C</tspan><tspan font-size="11.2" dy="3.8">msg</tspan><tspan font-size="16.0" dy="-3.8">) + 1</tspan></text>
