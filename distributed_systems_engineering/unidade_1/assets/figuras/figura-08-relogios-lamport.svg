<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="640" viewBox="0 0 1150 640" role="img">
  <title>Linha do tempo dos relógios lógicos de Lamport</title>
  <desc>diagrama de raias mostra os relógios lógicos de Pedidos, Estoque e Pagamento evoluindo por eventos locais e mensagens trocadas, evidenciando como o recebimento de mensagem ajusta o contador local.</desc>
  <rect width="1150" height="640" fill="#FFFFFF"/>
