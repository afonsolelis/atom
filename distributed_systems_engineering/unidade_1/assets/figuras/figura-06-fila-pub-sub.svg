  <rect x="663.0" y="370.0" width="124.0" height="62.0" rx="12" ry="12" fill="#FFFFFF" fill-opacity="1.0" stroke="#11A360" stroke-width="2.2"/>
  <text x="725.0" y="403.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#11A360" text-anchor="middle">Estoque</text>
  <line x1="855.0" y1="264.0" x2="855.0" y2="356.6" stroke="#11A360" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="855.0,366.0 848.3,350.9 861.7,350.9" fill="#11A360"/>
  <rect x="793.0" y="370.0" width="124.0" height="62.0" rx="12" ry="12" fill="#FFFFFF" fill-opacity="1.0" stroke="#11A360" stroke-width="2.2"/>
  <text x="855.0" y="403.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#11A360" text-anchor="middle">Fraude</text>
  <line x1="855.0" y1="264.0" x2="977.6" y2="360.2" stroke="#11A360" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="985.0,366.0 969.0,362.0 977.3,351.4" fill="#11A360"/>
  <rect x="923.0" y="370.0" width="124.0" height="62.0" rx="12" ry="12" fill="#FFFFFF" fill-opacity="1.0" stroke="#11A360" stroke-width="2.2"/>
  <text x="985.0" y="403.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#11A360" text-anchor="middle">Recomendação</text>
  <rect x="620.0" y="452.0" width="470.0" height="52.0" rx="10" ry="10" fill="#F2F4F8" fill-opacity="1.0" stroke="none" stroke-width="2"/>
  <text x="855.0" y="470.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#002156" text-anchor="middle">Cada mensagem publicada é entregue a todos os</text>
  <text x="855.0" y="490.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#002156" text-anchor="middle">assinantes do tópico.</text>
  <rect x="30.0" y="548.0" width="1090.0" height="40.0" rx="10" ry="10" fill="#FFFFFF" fill-opacity="1.0" stroke="none" stroke-width="2"/>
  <text x="575.0" y="570.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#5A6175" text-anchor="middle">Novos assinantes podem ser acrescentados sem alterar o produtor — ao custo de não haver resposta imediata.</text>
</svg>
