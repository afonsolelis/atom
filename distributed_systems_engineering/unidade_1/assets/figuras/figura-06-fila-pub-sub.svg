<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="600" viewBox="0 0 1150 600" role="img">
  <title>Fila versus publicação-assinatura</title>
  <desc>comparação visual entre o padrão de fila, em que cada mensagem vai a um único consumidor, e o padrão de publicação-assinatura, em que cada mensagem é entregue a todos os assinantes do tópico.</desc>
  <rect width="1150" height="600" fill="#FFFFFF"/>
  <rect x="30.0" y="30.0" width="530.0" height="500.0" rx="14" ry="14" fill="#FFFFFF" fill-opacity="1.0" stroke="#C7CEDB" stroke-width="2"/>
  <rect x="590.0" y="30.0" width="530.0" height="500.0" rx="14" ry="14" fill="#FFFFFF" fill-opacity="1.0" stroke="#C7CEDB" stroke-width="2"/>
  <text x="60.0" y="74.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#002156" text-anchor="start">Fila (ponto a ponto)</text>
  <rect x="220.0" y="100.0" width="150.0" height="54.0" rx="12" ry="12" fill="#002156" fill-opacity="1.0" stroke="#002156" stroke-width="2.2"/>
  <text x="295.0" y="130.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Produtor</text>
  <line x1="295.0" y1="154.0" x2="295.0" y2="184.7" stroke="#002156" stroke-width="2.3" stroke-linecap="round"/>
  <polygon points="295.0,194.0 288.3,178.9 301.7,178.9" fill="#002156"/>
  <rect x="95.0" y="200.0" width="400.0" height="64.0" rx="10" ry="10" fill="#F2F4F8" fill-opacity="1.0" stroke="#254AB9" stroke-width="2.2"/>
  <rect x="113.0" y="212.0" width="104.0" height="40.0" rx="8" ry="8" fill="#FFFFFF" fill-opacity="1.0" stroke="#254AB9" stroke-width="2"/>
  <text x="165.0" y="239.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#254AB9" text-anchor="middle">m1</text>
  <line x1="165.0" y1="264.0" x2="165.0" y2="356.6" stroke="#00B1D2" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="165.0,366.0 158.3,350.9 171.7,350.9" fill="#00B1D2"/>
  <rect x="103.0" y="370.0" width="124.0" height="62.0" rx="12" ry="12" fill="#FFFFFF" fill-opacity="1.0" stroke="#254AB9" stroke-width="2.2"/>
  <text x="165.0" y="404.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#254AB9" text-anchor="middle">Instância A</text>
  <rect x="243.0" y="212.0" width="104.0" height="40.0" rx="8" ry="8" fill="#FFFFFF" fill-opacity="1.0" stroke="#254AB9" stroke-width="2"/>
  <text x="295.0" y="239.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#254AB9" text-anchor="middle">m2</text>
  <line x1="295.0" y1="264.0" x2="295.0" y2="356.6" stroke="#00B1D2" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="295.0,366.0 288.3,350.9 301.7,350.9" fill="#00B1D2"/>
  <rect x="233.0" y="370.0" width="124.0" height="62.0" rx="12" ry="12" fill="#FFFFFF" fill-opacity="1.0" stroke="#254AB9" stroke-width="2.2"/>
  <text x="295.0" y="404.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#254AB9" text-anchor="middle">Instância B</text>
  <rect x="373.0" y="212.0" width="104.0" height="40.0" rx="8" ry="8" fill="#FFFFFF" fill-opacity="1.0" stroke="#254AB9" stroke-width="2"/>
  <text x="425.0" y="239.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#254AB9" text-anchor="middle">m3</text>
  <line x1="425.0" y1="264.0" x2="425.0" y2="356.6" stroke="#00B1D2" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="425.0,366.0 418.3,350.9 431.7,350.9" fill="#00B1D2"/>
  <rect x="363.0" y="370.0" width="124.0" height="62.0" rx="12" ry="12" fill="#FFFFFF" fill-opacity="1.0" stroke="#254AB9" stroke-width="2.2"/>
  <text x="425.0" y="404.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#254AB9" text-anchor="middle">Instância C</text>
  <rect x="60.0" y="452.0" width="470.0" height="52.0" rx="10" ry="10" fill="#F2F4F8" fill-opacity="1.0" stroke="none" stroke-width="2"/>
  <text x="295.0" y="470.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#002156" text-anchor="middle">Cada mensagem é entregue a um único consumidor entre os</text>
  <text x="295.0" y="490.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#002156" text-anchor="middle">que competem.</text>
  <text x="620.0" y="74.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#002156" text-anchor="start">Publicação-assinatura</text>
  <rect x="780.0" y="100.0" width="150.0" height="54.0" rx="12" ry="12" fill="#002156" fill-opacity="1.0" stroke="#002156" stroke-width="2.2"/>
  <text x="855.0" y="130.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Produtor</text>
  <line x1="855.0" y1="154.0" x2="855.0" y2="184.7" stroke="#002156" stroke-width="2.3" stroke-linecap="round"/>
  <polygon points="855.0,194.0 848.3,178.9 861.7,178.9" fill="#002156"/>
  <rect x="655.0" y="200.0" width="400.0" height="64.0" rx="10" ry="10" fill="#F2CB0A" fill-opacity="1.0" stroke="#F2CB0A" stroke-width="2.2"/>
  <text x="855.0" y="239.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#002156" text-anchor="middle">Tópico  PedidoCriado</text>
  <line x1="855.0" y1="264.0" x2="732.4" y2="360.2" stroke="#11A360" stroke-width="2.2" stroke-linecap="round"/>
