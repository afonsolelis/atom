<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="540" viewBox="0 0 1050 540" role="img">
  <title>Comparação de dois relógios vetoriais concorrentes</title>
  <desc>comparação posição a posição de dois relógios vetoriais evidencia que nenhum dos dois eventos precede causalmente o outro, caracterizando concorrência.</desc>
  <rect width="1050" height="540" fill="#FFFFFF"/>
  <rect x="50.0" y="40.0" width="400.0" height="104.0" rx="12" ry="12" fill="#FFFFFF" fill-opacity="1.0" stroke="#FF2B5F" stroke-width="2.2"/>
  <text x="250.0" y="82.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#C2185B" text-anchor="middle">Cancelamento no Estoque</text>
  <text x="250.0" y="112.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#1A1A1A" text-anchor="middle">V(a) = (2, 3, 0)</text>
  <rect x="600.0" y="40.0" width="400.0" height="104.0" rx="12" ry="12" fill="#FFFFFF" fill-opacity="1.0" stroke="#254AB9" stroke-width="2.2"/>
  <text x="800.0" y="82.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#254AB9" text-anchor="middle">Aprovação no Pagamento</text>
  <text x="800.0" y="112.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#1A1A1A" text-anchor="middle">V(b) = (2, 1, 2)</text>
  <text x="210.0" y="210.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5A6175" text-anchor="middle">posição</text>
  <text x="430.0" y="210.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#C2185B" text-anchor="middle">V(a)</text>
  <text x="525.0" y="210.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#5A6175" text-anchor="middle"></text>
  <text x="620.0" y="210.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#254AB9" text-anchor="middle">V(b)</text>
  <rect x="50.0" y="228.0" width="950.0" height="52.0" rx="8" ry="8" fill="#F2F4F8" fill-opacity="1.0" stroke="none" stroke-width="0"/>
  <text x="210.0" y="262.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="middle">Pedidos</text>
  <text x="430.0" y="262.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#C2185B" text-anchor="middle">2</text>
  <text x="525.0" y="262.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#5A6175" text-anchor="middle">=</text>
  <text x="620.0" y="262.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#254AB9" text-anchor="middle">2</text>
  <text x="700.0" y="262.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#5A6175" text-anchor="start">empate nesta posição</text>
  <rect x="50.0" y="290.0" width="950.0" height="52.0" rx="8" ry="8" fill="#FFFFFF" fill-opacity="1.0" stroke="none" stroke-width="0"/>
  <text x="210.0" y="324.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="middle">Estoque</text>
  <text x="430.0" y="324.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#C2185B" text-anchor="middle">3</text>
  <text x="525.0" y="324.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#C2185B" text-anchor="middle">&gt;</text>
  <text x="620.0" y="324.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#254AB9" text-anchor="middle">1</text>
  <text x="700.0" y="324.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#5A6175" text-anchor="start">a está à frente aqui</text>
  <rect x="50.0" y="352.0" width="950.0" height="52.0" rx="8" ry="8" fill="#F2F4F8" fill-opacity="1.0" stroke="none" stroke-width="0"/>
  <text x="210.0" y="386.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="middle">Pagamento</text>
  <text x="430.0" y="386.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#C2185B" text-anchor="middle">0</text>
  <text x="525.0" y="386.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#254AB9" text-anchor="middle">&lt;</text>
  <text x="620.0" y="386.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#254AB9" text-anchor="middle">2</text>
  <text x="700.0" y="386.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#5A6175" text-anchor="start">b está à frente aqui</text>
  <rect x="50.0" y="460.0" width="950.0" height="56.0" rx="10" ry="10" fill="#F2CB0A" fill-opacity="1.0" stroke="none" stroke-width="2"/>
  <text x="525.0" y="490.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#002156" text-anchor="middle">Nenhum vetor domina o outro em todas as posições: os eventos são concorrentes — nenhum causou o outro.</text>
</svg>
