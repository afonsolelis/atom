apiVersion: apps/v1
kind: Deployment
metadata:
  name: expedicao
  labels:
    app: expedicao
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expedicao
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: expedicao
    spec:
      containers:
        - name: expedicao
          image: nexaorder/expedicao:latest
          ports:
            - containerPort: 8000
          env:
            - name: EXPEDICAO_DB_PATH
              value: /data/expedicao.db
          envFrom:
            - secretRef:
                name: nexaorder-segredos
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /saude
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /pronto
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: dados
              mountPath: /data
      volumes:
        - name: dados
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: expedicao
spec:
  selector:
    app: expedicao
  ports:
    - port: 8000
      targetPort: 8000
