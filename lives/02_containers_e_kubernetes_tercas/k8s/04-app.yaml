# App web (Streamlit) — Deployment com ConfigMap, Secret, probes e resources
# (requests de CPU são obrigatórios para o HPA funcionar) + Service "web".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: livraria-app:v1
          imagePullPolicy: Never # imagem construída dentro do cluster (minikube image build)
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: web-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MONGO_URI
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe: # travou? reinicia o container
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe: # ainda subindo? tira do tráfego
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8501
