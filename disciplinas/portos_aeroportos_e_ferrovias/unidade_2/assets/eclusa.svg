<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Segoe UI',Arial,sans-serif" role="img" aria-label="Seção de uma eclusa mostrando montante com nível alto, câmara com comboio e jusante com nível baixo, separados por comportas">
  <defs>
    <marker id="ea" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#002057"/></marker>
    <marker id="es" markerWidth="9" markerHeight="9" refX="2" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M7,0 L0,3 L7,6 Z" fill="#002057"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="340" fill="#ffffff"/>
  <text x="330" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#002057">Eclusa: o "elevador de água" da hidrovia</text>

  <!-- estrutura de concreto -->
  <rect x="30" y="275" width="600" height="40" fill="#9aa0a6"/>
  <rect x="182" y="100" width="16" height="180" fill="#9aa0a6"/>
  <rect x="448" y="150" width="16" height="130" fill="#9aa0a6"/>

  <!-- água: montante (alto), câmara (médio), jusante (baixo) -->
  <rect x="30" y="110" width="152" height="165" fill="#bcd9ea"/>
  <rect x="198" y="150" width="250" height="125" fill="#acd0e6"/>
  <rect x="464" y="210" width="166" height="65" fill="#bcd9ea"/>

  <!-- comportas -->
  <rect x="184" y="100" width="12" height="180" rx="2" fill="#4a4f55"/>
  <rect x="450" y="150" width="12" height="130" rx="2" fill="#4a4f55"/>

  <!-- comboio na câmara -->
  <rect x="280" y="136" width="92" height="16" rx="4" fill="#1F44A8"/>
  <rect x="298" y="126" width="56" height="12" rx="3" fill="#15327d"/>

  <!-- níveis / rótulos -->
  <text x="106" y="100" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2a6f97">montante</text>
  <text x="106" y="135" text-anchor="middle" font-size="10" fill="#1b4e6b">nível alto</text>
  <text x="323" y="172" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b4e6b">câmara</text>
  <text x="547" y="200" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2a6f97">jusante</text>
  <text x="547" y="235" text-anchor="middle" font-size="10" fill="#1b4e6b">nível baixo</text>

  <!-- comportas labels -->
  <text x="190" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#4a4f55">comporta</text>
  <text x="456" y="142" text-anchor="middle" font-size="10" font-weight="700" fill="#4a4f55">comporta</text>

  <!-- enche/esvazia -->
  <line x1="323" y1="262" x2="323" y2="200" stroke="#1F8A4E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#eg)"/>
  <line x1="360" y1="200" x2="360" y2="262" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#er)"/>
  <defs>
    <marker id="eg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#1F8A4E"/></marker>
    <marker id="er" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#c0392b"/></marker>
  </defs>
  <text x="300" y="290" font-size="10" fill="#1F8A4E" font-weight="700">enche ↑ / esvazia ↓</text>

  <!-- desnível -->
  <line x1="610" y1="110" x2="610" y2="210" stroke="#002057" stroke-width="1.4" marker-start="url(#es)" marker-end="url(#ea)"/>
  <line x1="464" y1="110" x2="614" y2="110" stroke="#002057" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="600" y="162" font-size="12" font-weight="700" fill="#002057" transform="rotate(-90 600 162)" text-anchor="middle">desnível</text>

  <text x="330" y="332" text-anchor="middle" font-size="11" fill="#002057">O comboio entra, as comportas fecham, a câmara iguala o nível do outro lado e ele segue · ex.: Tucuruí vence ~72 m</text>
</svg>
