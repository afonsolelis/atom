<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Segoe UI',Arial,sans-serif" role="img" aria-label="Seção transversal mostrando a bitola medida entre as faces internas dos dois trilhos">
  <defs>
    <marker id="ba" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#002057"/>
    </marker>
    <marker id="bs" markerWidth="9" markerHeight="9" refX="2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M7,0 L0,3 L7,6 Z" fill="#002057"/>
    </marker>
    <linearGradient id="aco2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa6b4"/><stop offset="0.5" stop-color="#d6dce3"/><stop offset="1" stop-color="#9aa6b4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="560" height="330" fill="#ffffff"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#002057">Bitola: distância entre as faces internas dos boletos</text>

  <!-- dormente -->
  <rect x="115" y="232" width="330" height="28" rx="3" fill="#b9bfc6" stroke="#8b939c" stroke-width="1.5"/>
  <text x="280" y="251" text-anchor="middle" font-size="11" fill="#3a4250">dormente</text>

  <!-- trilho esquerdo -->
  <polygon points="165,112 195,112 195,134 188,142 184,152 184,207 200,220 202,232 158,232 160,220 176,207 176,152 172,142 165,134" fill="url(#aco2)" stroke="#002057" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- trilho direito -->
  <polygon points="365,112 395,112 395,134 388,142 384,152 384,207 400,220 402,232 358,232 360,220 376,207 376,152 372,142 365,134" fill="url(#aco2)" stroke="#002057" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- linha de cota da bitola (faces internas: x=195 e x=365) -->
  <line x1="195" y1="92" x2="365" y2="92" stroke="#002057" stroke-width="1.4" marker-start="url(#bs)" marker-end="url(#ba)"/>
  <line x1="195" y1="112" x2="195" y2="88" stroke="#002057" stroke-width="0.9" stroke-dasharray="3 3"/>
  <line x1="365" y1="112" x2="365" y2="88" stroke="#002057" stroke-width="0.9" stroke-dasharray="3 3"/>
  <text x="280" y="84" text-anchor="middle" font-size="13.5" font-weight="700" fill="#002057">BITOLA</text>

  <!-- valores -->
  <g font-size="13">
    <rect x="120" y="284" width="320" height="30" rx="6" fill="#002057"/>
    <text x="280" y="304" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Larga 1,60 m  ·  Métrica 1,00 m  ·  Padrão (UIC) 1,435 m</text>
  </g>
</svg>
