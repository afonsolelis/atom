<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="'Segoe UI',Arial,sans-serif" role="img" aria-label="Seções transversais de pavimento aeroportuário flexível e rígido, com as camadas e a distribuição de carga">
  <defs>
    <marker id="va" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="340" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#002057">Pavimento aeroportuário: flexível × rígido</text>

  <!-- ===== FLEXÍVEL ===== -->
  <text x="185" y="52" text-anchor="middle" font-size="13.5" font-weight="700" fill="#002057">FLEXÍVEL (asfáltico)</text>
  <rect x="168" y="84" width="34" height="16" rx="6" fill="#2b2b2b"/>
  <line x1="185" y1="100" x2="185" y2="114" stroke="#c0392b" stroke-width="2.2" marker-end="url(#va)"/>
  <!-- camadas -->
  <rect x="80" y="116" width="210" height="18" fill="#2b2b2b" stroke="#002057" stroke-width="1.2"/>
  <rect x="80" y="134" width="210" height="38" fill="#9a8c6a" stroke="#002057" stroke-width="1.2"/>
  <rect x="80" y="172" width="210" height="42" fill="#bcae8a" stroke="#002057" stroke-width="1.2"/>
  <rect x="80" y="214" width="210" height="72" fill="#8a6d4f" stroke="#002057" stroke-width="1.2"/>
  <!-- distribuição gradual -->
  <line x1="185" y1="116" x2="120" y2="286" stroke="#c0392b" stroke-width="1.1" stroke-dasharray="5 4"/>
  <line x1="185" y1="116" x2="250" y2="286" stroke="#c0392b" stroke-width="1.1" stroke-dasharray="5 4"/>
  <!-- rótulos dentro das camadas -->
  <text x="185" y="129" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Revestimento betuminoso (~10–13 cm)</text>
  <text x="185" y="157" text-anchor="middle" font-size="10.5" fill="#002057">Base granular (~20–30 cm)</text>
  <text x="185" y="197" text-anchor="middle" font-size="10.5" fill="#002057">Sub-base (~30–45 cm)</text>
  <text x="185" y="254" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">Subleito compactado</text>

  <!-- ===== RÍGIDO ===== -->
  <text x="455" y="52" text-anchor="middle" font-size="13.5" font-weight="700" fill="#002057">RÍGIDO (concreto)</text>
  <rect x="438" y="84" width="34" height="16" rx="6" fill="#2b2b2b"/>
  <line x1="455" y1="100" x2="455" y2="114" stroke="#c0392b" stroke-width="2.2" marker-end="url(#va)"/>
  <rect x="350" y="116" width="210" height="42" fill="#cfd6dd" stroke="#002057" stroke-width="1.4"/>
  <rect x="350" y="158" width="210" height="36" fill="#9a8c6a" stroke="#002057" stroke-width="1.2"/>
  <rect x="350" y="194" width="210" height="92" fill="#8a6d4f" stroke="#002057" stroke-width="1.2"/>
  <!-- distribuição ampla pela placa (flexão) -->
  <line x1="405" y1="158" x2="378" y2="286" stroke="#c0392b" stroke-width="1.1" stroke-dasharray="5 4"/>
  <line x1="505" y1="158" x2="532" y2="286" stroke="#c0392b" stroke-width="1.1" stroke-dasharray="5 4"/>
  <line x1="405" y1="158" x2="505" y2="158" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="455" y="141" text-anchor="middle" font-size="10.5" font-weight="700" fill="#002057">Placa de concreto (PCC, ~30–45 cm)</text>
  <text x="455" y="180" text-anchor="middle" font-size="10.5" fill="#002057">Base / sub-base</text>
  <text x="455" y="244" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">Subleito compactado</text>

  <!-- legenda -->
  <text x="185" y="306" text-anchor="middle" font-size="10.5" fill="#c0392b" font-weight="700">distribui em camadas (gradual)</text>
  <text x="455" y="306" text-anchor="middle" font-size="10.5" fill="#c0392b" font-weight="700">trabalha por flexão da placa (área ampla)</text>
  <text x="320" y="330" text-anchor="middle" font-size="11" fill="#3a4250">Pista costuma ser flexível; pátio (carga estática prolongada) costuma ser rígido.</text>
</svg>
