<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="'Segoe UI',Arial,sans-serif" role="img" aria-label="Cargas de referência por modal: eixo rodoviário, eixo ferroviário e trem de pouso de aeronave">
  <defs>
    <marker id="ca" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#002057">Cargas de referência por modal</text>

  <!-- ===== RODOVIA ===== -->
  <rect x="55" y="172" width="130" height="9" fill="#9aa0a6"/>
  <line x1="98" y1="150" x2="142" y2="150" stroke="#2b2b2b" stroke-width="5"/>
  <ellipse cx="98" cy="160" rx="9" ry="15" fill="#2b2b2b"/>
  <ellipse cx="142" cy="160" rx="9" ry="15" fill="#2b2b2b"/>
  <line x1="120" y1="120" x2="120" y2="146" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ca)"/>
  <text x="120" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#002057">Rodovia</text>
  <text x="120" y="224" text-anchor="middle" font-size="10.5" fill="#5a6573">eixo-padrão</text>
  <text x="120" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">8,2 t = 80 kN</text>

  <!-- ===== FERROVIA ===== -->
  <rect x="290" y="172" width="130" height="9" fill="#9aa0a6"/>
  <rect x="300" y="168" width="110" height="5" fill="#6b7280"/>
  <line x1="328" y1="150" x2="382" y2="150" stroke="#2b2b2b" stroke-width="5"/>
  <ellipse cx="328" cy="158" rx="11" ry="16" fill="#46566a" stroke="#2b2b2b" stroke-width="1.5"/>
  <ellipse cx="382" cy="158" rx="11" ry="16" fill="#46566a" stroke="#2b2b2b" stroke-width="1.5"/>
  <line x1="355" y1="120" x2="355" y2="146" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ca)"/>
  <text x="355" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#002057">Ferrovia</text>
  <text x="355" y="224" text-anchor="middle" font-size="10.5" fill="#5a6573">carga por eixo</text>
  <text x="355" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#1F44A8">25 a 32,5 t</text>

  <!-- ===== AERONAVE ===== -->
  <rect x="510" y="172" width="140" height="9" fill="#9aa0a6"/>
  <line x1="580" y1="118" x2="580" y2="148" stroke="#46566a" stroke-width="6"/>
  <rect x="540" y="146" width="80" height="8" rx="3" fill="#46566a"/>
  <ellipse cx="548" cy="162" rx="8" ry="12" fill="#2b2b2b"/>
  <ellipse cx="570" cy="162" rx="8" ry="12" fill="#2b2b2b"/>
  <ellipse cx="592" cy="162" rx="8" ry="12" fill="#2b2b2b"/>
  <ellipse cx="614" cy="162" rx="8" ry="12" fill="#2b2b2b"/>
  <text x="580" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#002057">Aeronave</text>
  <text x="580" y="224" text-anchor="middle" font-size="10.5" fill="#5a6573">trem de pouso</text>
  <text x="580" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#1F8A4E">centenas de t</text>
  <text x="580" y="259" text-anchor="middle" font-size="9.5" fill="#5a6573">(distribuídas em várias rodas)</text>

  <text x="340" y="285" text-anchor="middle" font-size="11.5" fill="#c0392b" font-weight="700">Não é só o peso: a REPETIÇÃO destrói o pavimento — é o conceito do número N (passagens do eixo-padrão).</text>
</svg>
