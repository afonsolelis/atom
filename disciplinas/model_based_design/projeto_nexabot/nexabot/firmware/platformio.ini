; platformio.ini — firmware do alvo HIL real (ESP32) do NexaBot.
;
; ATENÇÃO: este projeto NÃO compila no ambiente de gravação/CI deste
; repositório (não há PlatformIO nem toolchain Xtensa/RISC-V instalados
; aqui, só gcc do host para o back-end LoopbackTarget). Para compilar e
; gravar de verdade, o estudante precisa, na própria máquina:
;
;   1. instalar o PlatformIO (`pip install platformio` ou a extensão do
;      VSCode);
;   2. conectar um ESP32 por USB;
;   3. rodar, dentro desta pasta:
;
;        pio run                 # compila
;        pio run -t upload       # grava no ESP32
;        pio device monitor -b 115200   # abre o terminal serial
;
; O protocolo de linha falado pela UART é o mesmo do LoopbackTarget (ver
; nexabot/hil.py e nexabot/firmware/main_loopback.c): "STEP r y [delay_ms]",
; "RESET", "QUIT" -> "U u" / "OK".

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17
