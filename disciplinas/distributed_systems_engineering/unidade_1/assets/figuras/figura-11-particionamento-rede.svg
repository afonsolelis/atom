<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img">
  <title>Particionamento de rede entre zonas</title>
  <desc>diagrama mostra duas zonas isoladas por um rompimento de rede, cada uma seguindo operante e aceitando requisições sem saber do estado da outra.</desc>
  <rect width="1100" height="570" fill="#FFFFFF"/>
  <rect x="40.0" y="80.0" width="440.0" height="330.0" rx="14" ry="14" fill="#FFFFFF" fill-opacity="1.0" stroke="#254AB9" stroke-width="2.2"/>
  <text x="260.0" y="118.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#002156" text-anchor="middle">Zona de disponibilidade A</text>
  <rect x="145.0" y="150.0" width="230.0" height="78.0" rx="12" ry="12" fill="#FFFFFF" fill-opacity="1.0" stroke="#11A360" stroke-width="2.2"/>
  <text x="260.0" y="183.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#11A360" text-anchor="middle">Réplica do estoque</text>
  <text x="260.0" y="205.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#5A6175" text-anchor="middle">aceita reservas</text>
  <rect x="170.0" y="300.0" width="180.0" height="62.0" rx="12" ry="12" fill="#F2F4F8" fill-opacity="1.0" stroke="#C7CEDB" stroke-width="2.2"/>
  <text x="260.0" y="334.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">Clientes locais</text>
  <line x1="260.0" y1="296.0" x2="260.0" y2="243.3" stroke="#11A360" stroke-width="2.3" stroke-linecap="round"/>
  <polygon points="260.0,234.0 266.7,249.1 253.3,249.1" fill="#11A360"/>
  <rect x="263.0" y="260.0" width="144.9" height="19.5" rx="5" ry="5" fill="#FFFFFF" fill-opacity="1.0" stroke="none" stroke-width="0"/>
  <text x="270.0" y="272.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5A6175" text-anchor="start">requisições aceitas</text>
  <rect x="620.0" y="80.0" width="440.0" height="330.0" rx="14" ry="14" fill="#FFFFFF" fill-opacity="1.0" stroke="#254AB9" stroke-width="2.2"/>
  <text x="840.0" y="118.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#002156" text-anchor="middle">Zona de disponibilidade B</text>
  <rect x="725.0" y="150.0" width="230.0" height="78.0" rx="12" ry="12" fill="#FFFFFF" fill-opacity="1.0" stroke="#11A360" stroke-width="2.2"/>
  <text x="840.0" y="183.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#11A360" text-anchor="middle">Réplica do estoque</text>
  <text x="840.0" y="205.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#5A6175" text-anchor="middle">aceita reservas</text>
  <rect x="750.0" y="300.0" width="180.0" height="62.0" rx="12" ry="12" fill="#F2F4F8" fill-opacity="1.0" stroke="#C7CEDB" stroke-width="2.2"/>
  <text x="840.0" y="334.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">Clientes locais</text>
  <line x1="840.0" y1="296.0" x2="840.0" y2="243.3" stroke="#11A360" stroke-width="2.3" stroke-linecap="round"/>
  <polygon points="840.0,234.0 846.7,249.1 833.3,249.1" fill="#11A360"/>
  <rect x="843.0" y="260.0" width="144.9" height="19.5" rx="5" ry="5" fill="#FFFFFF" fill-opacity="1.0" stroke="none" stroke-width="0"/>
  <text x="850.0" y="272.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5A6175" text-anchor="start">requisições aceitas</text>
  <line x1="484.0" y1="255.0" x2="528.0" y2="255.0" stroke="#5A6175" stroke-width="3" stroke-linecap="round"/>
  <line x1="572.0" y1="255.0" x2="616.0" y2="255.0" stroke="#5A6175" stroke-width="3" stroke-linecap="round"/>
  <line x1="536.0" y1="235.0" x2="564.0" y2="275.0" stroke="#FF2B5F" stroke-width="4" stroke-linecap="round"/>
  <line x1="564.0" y1="235.0" x2="536.0" y2="275.0" stroke="#FF2B5F" stroke-width="4" stroke-linecap="round"/>
  <rect x="467.5" y="191.2" width="165.1" height="22.5" rx="5" ry="5" fill="#FFFFFF" fill-opacity="1.0" stroke="none" stroke-width="0"/>
  <text x="550.0" y="205.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#C2185B" text-anchor="middle">comunicação rompida</text>
  <rect x="40.0" y="446.0" width="1020.0" height="84.0" rx="10" ry="10" fill="#F2F4F8" fill-opacity="1.0" stroke="none" stroke-width="2"/>
  <text x="550.0" y="479.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#002156" text-anchor="middle">Nenhum dos lados está “caído”: ambos continuam vivos e aceitando reservas para os mesmos itens. O resultado é</text>
  <text x="550.0" y="501.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#002156" text-anchor="middle">uma divergência de estado (split-brain) que precisará ser reconciliada depois.</text>
</svg>
