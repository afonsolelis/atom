<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="570" viewBox="0 0 1150 570" role="img">
  <title>Ordem parcial versus ordem total</title>
  <desc>comparação entre um grafo de ordem parcial, com eventos concorrentes sem relação direta, e uma linha única de ordem total, evidenciando que a ordem total não recupera relações causais inexistentes.</desc>
  <rect width="1150" height="570" fill="#FFFFFF"/>
  <rect x="30.0" y="30.0" width="530.0" height="420.0" rx="14" ry="14" fill="#FFFFFF" fill-opacity="1.0" stroke="#C7CEDB" stroke-width="2"/>
  <rect x="590.0" y="30.0" width="530.0" height="420.0" rx="14" ry="14" fill="#FFFFFF" fill-opacity="1.0" stroke="#C7CEDB" stroke-width="2"/>
  <text x="60.0" y="74.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#002156" text-anchor="start">Ordem parcial (happened-before)</text>
  <line x1="160.0" y1="180.0" x2="248.7" y2="180.0" stroke="#002156" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="258.0,180.0 242.9,186.7 242.9,173.3" fill="#002156"/>
  <line x1="320.0" y1="180.0" x2="408.6" y2="180.0" stroke="#002156" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="418.0,180.0 402.9,186.7 402.9,173.3" fill="#002156"/>
  <line x1="206.2" y1="315.4" x2="413.9" y2="200.1" stroke="#002156" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="422.0,195.5 412.1,208.7 405.6,197.0" fill="#002156"/>
  <circle cx="130.0" cy="180.0" r="28.0" fill="#FFFFFF" stroke="#254AB9" stroke-width="2.6"/>
  <text x="130.0" y="188.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#254AB9" text-anchor="middle">a</text>
  <circle cx="290.0" cy="180.0" r="28.0" fill="#FFFFFF" stroke="#FF2B5F" stroke-width="3"/>
  <text x="290.0" y="188.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#C2185B" text-anchor="middle">b</text>
  <circle cx="450.0" cy="180.0" r="28.0" fill="#FFFFFF" stroke="#254AB9" stroke-width="2.6"/>
  <text x="450.0" y="188.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#254AB9" text-anchor="middle">d</text>
  <circle cx="180.0" cy="330.0" r="28.0" fill="#FFFFFF" stroke="#254AB9" stroke-width="2.6"/>
  <text x="180.0" y="338.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#254AB9" text-anchor="middle">c</text>
  <circle cx="340.0" cy="350.0" r="28.0" fill="#FFFFFF" stroke="#FF2B5F" stroke-width="3"/>
  <text x="340.0" y="358.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#C2185B" text-anchor="middle">e</text>
  <text x="60.0" y="415.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#C2185B" text-anchor="start">Nenhum caminho de setas liga b a e, nem e a b:</text>
  <text x="60.0" y="437.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#C2185B" text-anchor="start">são concorrentes, e nenhum causou o outro.</text>
  <text x="620.0" y="74.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#002156" text-anchor="start">Ordem total imposta</text>
  <line x1="650.0" y1="260.0" x2="1090.0" y2="260.0" stroke="#C7CEDB" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="690.0" cy="260.0" r="26.0" fill="#FFFFFF" stroke="#5A6175" stroke-width="2.4"/>
  <text x="690.0" y="268.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">a</text>
  <line x1="718.0" y1="260.0" x2="743.2" y2="260.0" stroke="#5A6175" stroke-width="2" stroke-linecap="round"/>
  <polygon points="750.0,260.0 739.0,264.9 739.0,255.1" fill="#5A6175"/>
  <circle cx="778.0" cy="260.0" r="26.0" fill="#FFFFFF" stroke="#5A6175" stroke-width="2.4"/>
  <text x="778.0" y="268.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">c</text>
  <line x1="806.0" y1="260.0" x2="831.2" y2="260.0" stroke="#5A6175" stroke-width="2" stroke-linecap="round"/>
  <polygon points="838.0,260.0 827.0,264.9 827.0,255.1" fill="#5A6175"/>
  <circle cx="866.0" cy="260.0" r="26.0" fill="#FFFFFF" stroke="#5A6175" stroke-width="2.4"/>
  <text x="866.0" y="268.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">b</text>
  <line x1="894.0" y1="260.0" x2="919.2" y2="260.0" stroke="#5A6175" stroke-width="2" stroke-linecap="round"/>
  <polygon points="926.0,260.0 915.0,264.9 915.0,255.1" fill="#5A6175"/>
  <circle cx="954.0" cy="260.0" r="26.0" fill="#FFFFFF" stroke="#5A6175" stroke-width="2.4"/>
  <text x="954.0" y="268.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">e</text>
  <line x1="982.0" y1="260.0" x2="1007.2" y2="260.0" stroke="#5A6175" stroke-width="2" stroke-linecap="round"/>
  <polygon points="1014.0,260.0 1003.0,264.9 1003.0,255.1" fill="#5A6175"/>
  <circle cx="1042.0" cy="260.0" r="26.0" fill="#FFFFFF" stroke="#5A6175" stroke-width="2.4"/>
  <text x="1042.0" y="268.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">d</text>
  <rect x="718.3" y="187.1" width="303.4" height="21.0" rx="5" ry="5" fill="#FFFFFF" fill-opacity="1.0" stroke="none" stroke-width="0"/>
  <text x="870.0" y="200.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5A6175" text-anchor="middle">desempate por identificador de processo</text>
  <text x="620.0" y="415.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#5A6175" text-anchor="start">A posição relativa de c e e é arbitrária:</text>
  <text x="620.0" y="437.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#5A6175" text-anchor="start">a ordem total não afirma causalidade.</text>
  <rect x="30.0" y="470.0" width="1090.0" height="56.0" rx="10" ry="10" fill="#F2F4F8" fill-opacity="1.0" stroke="none" stroke-width="2"/>
  <text x="575.0" y="489.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#002156" text-anchor="middle">Impor uma ordem total sobre eventos concorrentes produz uma decisão única e determinística — mas não recupera a</text>
  <text x="575.0" y="511.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#002156" text-anchor="middle">causalidade que nunca existiu.</text>
</svg>
