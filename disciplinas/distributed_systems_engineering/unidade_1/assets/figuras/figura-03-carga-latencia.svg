<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="625" viewBox="0 0 1050 625" role="img">
  <title>Carga versus latência</title>
  <desc>gráfico relaciona carga e latência; a latência cresce lentamente até o ponto de saturação e depois aumenta de forma abrupta.</desc>
  <rect width="1050" height="625" fill="#FFFFFF"/>
  <rect x="725.5" y="90.0" width="207.6" height="380.0" rx="0" ry="0" fill="#FF2B5F" fill-opacity="0.07" stroke="none" stroke-width="0"/>
  <line x1="120.0" y1="427.8" x2="985.0" y2="427.8" stroke="#C7CEDB" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 6"/>
  <text x="106.0" y="433.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5A6175" text-anchor="end">100 ms</text>
  <line x1="120.0" y1="343.3" x2="985.0" y2="343.3" stroke="#C7CEDB" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 6"/>
  <text x="106.0" y="349.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5A6175" text-anchor="end">300 ms</text>
  <line x1="120.0" y1="216.7" x2="985.0" y2="216.7" stroke="#C7CEDB" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 6"/>
  <text x="106.0" y="222.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5A6175" text-anchor="end">600 ms</text>
  <line x1="120.0" y1="90.0" x2="985.0" y2="90.0" stroke="#C7CEDB" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 6"/>
  <text x="106.0" y="96.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5A6175" text-anchor="end">900 ms</text>
  <path d="M 120.0 444.7 L 133.6 444.3 L 147.1 443.8 L 160.7 443.4 L 174.2 443.0 L 187.8 442.5 L 201.3 442.0 L 214.9 441.5 L 228.4 441.0 L 242.0 440.5 L 255.5 440.0 L 269.1 439.4 L 282.6 438.8 L 296.2 438.2 L 309.7 437.5 L 323.3 436.9 L 336.8 436.2 L 350.4 435.5 L 363.9 434.7 L 377.5 433.9 L 391.0 433.1 L 404.6 432.2 L 418.1 431.3 L 431.7 430.4 L 445.2 429.4 L 458.8 428.4 L 472.3 427.3 L 485.9 426.1 L 499.4 424.9 L 513.0 423.6 L 526.5 422.2 L 540.1 420.7 L 553.7 419.2 L 567.2 417.6 L 580.8 415.8 L 594.3 413.9 L 607.9 411.9 L 621.4 409.7 L 635.0 407.4 L 648.5 404.9 L 662.1 402.1 L 675.6 399.2 L 689.2 395.9 L 702.7 392.4 L 716.3 388.5 L 729.8 384.1 L 743.4 379.3 L 756.9 373.9 L 770.5 367.8 L 784.0 361.0 L 797.6 353.1 L 811.1 344.0 L 824.7 333.3 L 838.2 320.7 L 851.8 305.5 L 865.3 286.9 L 878.9 263.5 L 892.4 233.2 L 906.0 192.6 L 919.5 135.2 L 933.1 90.0" fill="none" stroke="#002156" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="725.5" y1="470.0" x2="725.5" y2="379.6" stroke="#FF2B5F" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
  <circle cx="725.5" cy="385.6" r="7.0" fill="#FF2B5F" stroke="none" stroke-width="2"/>
  <rect x="557.4" y="353.8" width="157.1" height="22.5" rx="5" ry="5" fill="#FFFFFF" fill-opacity="1.0" stroke="none" stroke-width="0"/>
  <text x="707.5" y="367.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#C2185B" text-anchor="end">ponto de saturação</text>
  <line x1="120.0" y1="470.0" x2="1005.6" y2="470.0" stroke="#5A6175" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="1015.0,470.0 999.9,476.7 999.9,463.3" fill="#5A6175"/>
  <line x1="120.0" y1="470.0" x2="120.0" y2="77.3" stroke="#5A6175" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="120.0,68.0 126.7,83.1 113.3,83.1" fill="#5A6175"/>
  <line x1="336.2" y1="470.0" x2="336.2" y2="477.0" stroke="#5A6175" stroke-width="2" stroke-linecap="round"/>
  <text x="336.2" y="496.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5A6175" text-anchor="middle">25%</text>
  <line x1="552.5" y1="470.0" x2="552.5" y2="477.0" stroke="#5A6175" stroke-width="2" stroke-linecap="round"/>
  <text x="552.5" y="496.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5A6175" text-anchor="middle">50%</text>
  <line x1="725.5" y1="470.0" x2="725.5" y2="477.0" stroke="#5A6175" stroke-width="2" stroke-linecap="round"/>
  <text x="725.5" y="496.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5A6175" text-anchor="middle">70%</text>
  <line x1="898.5" y1="470.0" x2="898.5" y2="477.0" stroke="#5A6175" stroke-width="2" stroke-linecap="round"/>
  <text x="898.5" y="496.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5A6175" text-anchor="middle">90%</text>
  <text x="552.5" y="526.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="middle">carga (fração da capacidade)</text>
  <text x="74.0" y="56.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="start">latência p95</text>
  <text x="812.0" y="288.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#C2185B" text-anchor="end">filas crescem;</text>
  <text x="812.0" y="313.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#C2185B" text-anchor="end">a latência dispara</text>
  <rect x="30.0" y="548.0" width="990.0" height="56.0" rx="10" ry="10" fill="#F2F4F8" fill-opacity="1.0" stroke="none" stroke-width="2"/>
  <text x="525.0" y="567.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#002156" text-anchor="middle">Antes da saturação, mais carga custa pouca latência. Depois dela, a mesma carga adicional custa muito —</text>
  <text x="525.0" y="589.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#002156" text-anchor="middle">por isso o percentil importa mais que a média.</text>
</svg>
