# Cluster kind para a Aula 16 — três nós, para que as réplicas de cada
# Deployment sejam de fato distribuídas e o `kubectl get pods -o wide`
# mostre nomes de nó diferentes.
#
#   kind create cluster --name nexaorder --config k8s/kind/cluster.yaml
#
# O extraPortMappings publica o NodePort 30080 (o Service `gateway`, do tipo
# LoadBalancer, também recebe um NodePort) na porta 8080 do host. As portas
# 8000–8004 ficam livres de propósito: são as do `docker-compose` desta
# mesma aula, que pode continuar rodando em paralelo ao cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: nexaorder
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker
