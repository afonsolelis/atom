# NexaOrder — Aula 12: os cinco serviços, agora com identidade entre eles.
#
# pedidos orquestra a saga chamando estoque, pagamento e expedição, cada um
# com seu próprio banco, protegidos por timeout, retry e disjuntor
# independentes (docs/adr/0004) e coordenados por compensação, não por
# transação distribuída (docs/saga.md). O gateway compõe uma visão única de
# pedido para quem consome a API de fora (docs/limites-de-dominio.md).
#
# A partir da Aula 12, toda chamada mutável entre serviços exige um token
# assinado com NEXAORDER_SEGREDO_ASSINATURA (docs/seguranca.md) — copie
# .env.example para .env com um segredo real antes de subir.
#
# Uso:
#   cp .env.example .env   # edite o segredo antes de usar em qualquer lugar real
#   make up      (usa Docker ou Podman — ver Makefile)
#   curl -X POST http://localhost:8002/estoque/TECLADO-MEC-01/inicializar -d '{"quantidade": 100}'
#   curl -X POST http://localhost:8001/pedidos -d '...'
#   curl -X POST http://localhost:8001/pedidos/<id>/finalizar-compra
#   curl http://localhost:8000/pedidos/<id>/resumo

services:
  estoque:
    build: ./services/estoque
    ports:
      - "8002:8000"
    environment:
      - NEXAORDER_SEGREDO_ASSINATURA=${NEXAORDER_SEGREDO_ASSINATURA:-segredo-de-desenvolvimento-nao-usar-em-producao}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 5s
      timeout: 3s
      retries: 5

  pagamento:
    build: ./services/pagamento
    ports:
      - "8003:8000"
    environment:
      - NEXAORDER_SEGREDO_ASSINATURA=${NEXAORDER_SEGREDO_ASSINATURA:-segredo-de-desenvolvimento-nao-usar-em-producao}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 5s
      timeout: 3s
      retries: 5

  expedicao:
    build: ./services/expedicao
    ports:
      - "8004:8000"
    environment:
      - NEXAORDER_SEGREDO_ASSINATURA=${NEXAORDER_SEGREDO_ASSINATURA:-segredo-de-desenvolvimento-nao-usar-em-producao}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 5s
      timeout: 3s
      retries: 5

  pedidos:
    build: ./services/pedidos
    ports:
      - "8001:8000"
    environment:
      - PEDIDOS_DB_PATH=/data/pedidos.db
      - ESTOQUE_BASE_URL=http://estoque:8000
      - PAGAMENTO_BASE_URL=http://pagamento:8000
      - EXPEDICAO_BASE_URL=http://expedicao:8000
      - NEXAORDER_SEGREDO_ASSINATURA=${NEXAORDER_SEGREDO_ASSINATURA:-segredo-de-desenvolvimento-nao-usar-em-producao}
    volumes:
      - pedidos-data:/data
    depends_on:
      estoque:
        condition: service_healthy
      pagamento:
        condition: service_healthy
      expedicao:
        condition: service_healthy

  gateway:
    build: ./services/gateway
    ports:
      - "8000:8000"
    environment:
      - PEDIDOS_BASE_URL=http://pedidos:8000
      - ESTOQUE_BASE_URL=http://estoque:8000
      - PAGAMENTO_BASE_URL=http://pagamento:8000
      - EXPEDICAO_BASE_URL=http://expedicao:8000
    depends_on:
      pedidos:
        condition: service_started

volumes:
  pedidos-data:
