# Gateway — Unidade 3, Aula 11.
#
# Sem volume, sem variável de caminho de banco: o gateway não guarda
# estado (ver Aula 9, ADR 0009). O readinessProbe aqui verifica /pronto,
# que internamente checa se `pedidos` está alcançável — não apenas se o
# processo do gateway está de pé.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: nexaorder/gateway:latest
          ports:
            - containerPort: 8000
          env:
            - name: PEDIDOS_BASE_URL
              value: http://pedidos:8000
            - name: ESTOQUE_BASE_URL
              value: http://estoque:8000
            - name: PAGAMENTO_BASE_URL
              value: http://pagamento:8000
            - name: EXPEDICAO_BASE_URL
              value: http://expedicao:8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /saude
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /pronto
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
